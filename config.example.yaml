# shop-bot 配置。
# 环境变量（前缀 SHOP_BOT_）会覆盖这些值，嵌套键用双下划线，例如 SHOP_BOT_UPSTREAM__BASE_URL。

bot_token: ""                # @BotFather 的 bot token；或设 SHOP_BOT_BOT_TOKEN
admin_ids: []                # 有管理员命令权限的 telegram 用户 ID
database_path: shop_bot.db

webhook:                     # Telegram 推送更新的公网 HTTPS 端点
  host: 127.0.0.1            # 监听地址（通常前面有反向代理）
  port: 8080
  path: /webhook             # bot 更新路径
  url: ""                    # 公网地址，例如 https://bot.example.com
  secret_token: ""           # 必填；随机密钥，1–256 个字母/数字/下划线/连字符

payment:                     # 支付网关回调
  callback_path: /payment/callback
  secret: ""                 # 签名验证共享密钥（EPay 用不到，走自己的 MD5 签名）

epay:                        # EPay（易支付）网关配置
  pid: ""                    # 商户 ID
  key: ""                    # 商户密钥
  url: ""                    # 网关地址，例如 https://pay.example.com
  type: alipay               # 默认支付方式
  currency: USD              # 必须与 EPay 商户实际收款币种一致；人民币商户请设为 CNY，不自动换汇

features:                    # 功能开关
  kyc: true                  # 是否向买家开放 KYC 证件补交（按钮与 /kyc 命令）

operations:
  alerts_enabled: true       # 运维告警私信 admin_ids；管理员需先与 Bot 发起私聊
  check_interval_seconds: 30
  alert_cooldown_seconds: 1800 # 相同未恢复问题每 30 分钟提醒；新变化/恢复立即通知
  stale_order_seconds: 900   # 履约/退款停滞 15 分钟触发告警，正常等证件/物流不计入
  notification_stale_seconds: 300
  worker_stale_seconds: 180
  health_timeout_seconds: 2

backup:
  enabled: true              # 启动时备份一次，之后按周期执行；失败一分钟后重试
  directory: backups         # 相对路径基于数据库所在目录；也可指定挂载的备份磁盘路径
  interval_seconds: 86400
  keep: 14                  # 校验成功后只保留本数据库最近 14 份快照
  timeout_seconds: 120

logging:                     # 日志配置
  level: INFO                # DEBUG/INFO/WARNING/ERROR/CRITICAL
  log_dir: ""                # 日志文件目录；空表示只输出到 stdout
  json_logs: false           # 生产环境建议改成 true

upstream:                    # 上游供应商（Commbitz 分销 API）
  provider: ""               # commbitz = 启动时同步上游目录；留空 = 仅模拟发货
  environment: uat           # uat / live
  api_key: ""                # Commbitz 分销商 API Key
  secret_key: ""             # Commbitz 分销商 Secret Key
  timeout: 15                # 上游请求超时（秒）
  base_url: ""               # 可选覆盖；留空按 environment 选择
